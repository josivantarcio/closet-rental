# =============================================================================
# CI/CD — Closet Rental
#
# Jobs:
#   1. build-and-test  → push e PR para main (testes com H2, sem PostgreSQL)
#   2. docker-build    → push para main apenas (após testes passarem)
#                        publica imagem em ghcr.io/josivantarcio/closet-rental
# =============================================================================

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancela runs anteriores do mesmo PR/branch para economizar minutos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Build + Testes
  # Sem PostgreSQL — testes usam H2 in-memory (@ActiveProfiles("test"))
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Permissão do Maven Wrapper
        run: chmod +x backend/closetRental/mvnw

      - name: Build e testes
        run: ./mvnw verify -B --no-transfer-progress
        working-directory: backend/closetRental

      - name: Upload relatórios de falha (Surefire)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_number }}
          path: backend/closetRental/target/surefire-reports/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2: Docker Build & Push
  # Apenas em push para main, após testes passarem
  # Publica em: ghcr.io/josivantarcio/closet-rental
  # Tags: latest + sha-<commit>
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build & Push (ghcr.io)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/josivantarcio/closet-rental
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build e Push
        uses: docker/build-push-action@v6
        with:
          context: ./backend/closetRental
          file: ./backend/closetRental/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
