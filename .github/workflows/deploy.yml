# =============================================================================
# deploy.yml — Deploy para AWS ECS Fargate
#
# Fluxo:
#   push main → build-and-test → build ECR + push → update ECS service
#
# Secrets necessários no GitHub (Settings → Secrets → Actions):
#   AWS_ACCOUNT_ID       → ID da conta AWS (12 dígitos)
#   AWS_ACCESS_KEY_ID    → Chave de acesso IAM (permissões ECR + ECS)
#   AWS_SECRET_ACCESS_KEY→ Chave secreta IAM
#
# Variáveis (Settings → Variables → Actions):
#   AWS_REGION           → us-east-1
#   ECR_REPOSITORY       → closet-rental-prod
#   ECS_CLUSTER          → closet-rental-prod
#   ECS_SERVICE          → closet-rental-prod-svc
# =============================================================================

name: Deploy — AWS ECS

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # deploy nunca cancela outro deploy

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Testes (reutiliza lógica do CI)
  # ---------------------------------------------------------------------------
  test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Permissão Maven Wrapper
        run: chmod +x backend/closetRental/mvnw

      - name: Testes
        run: ./mvnw verify -B --no-transfer-progress
        working-directory: backend/closetRental

  # ---------------------------------------------------------------------------
  # Job 2: Build da imagem e push para ECR
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push → ECR
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Gerar tag da imagem
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          TAG="sha-${SHA_SHORT}"
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPO="${{ vars.ECR_REPOSITORY }}"
          URI="${REGISTRY}/${REPO}:${TAG}"
          echo "image_tag=${TAG}"  >> "$GITHUB_OUTPUT"
          echo "image_uri=${URI}"  >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push para ECR
        uses: docker/build-push-action@v6
        with:
          context:    ./backend/closetRental
          file:       ./backend/closetRental/Dockerfile
          push:       true
          tags:       ${{ steps.meta.outputs.image_uri }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          platforms:  linux/amd64

  # ---------------------------------------------------------------------------
  # Job 3: Deploy rolling no ECS
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy → ECS Fargate
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Login no Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Buscar task definition atual
        id: get-task-def
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_CLUSTER }}" \
            --query taskDefinition \
            --output json)
          echo "$TASK_DEF" > task-definition.json
          echo "Revision: $(echo $TASK_DEF | jq -r .revision)"

      - name: Atualizar imagem na task definition
        id: update-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name:  api
          image:           ${{ needs.build-and-push.outputs.image_uri }}

      - name: Deploy no ECS (rolling update)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:      ${{ steps.update-task-def.outputs.task-definition }}
          service:              ${{ vars.ECS_SERVICE }}
          cluster:              ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes:     10

      - name: Resultado do deploy
        run: |
          echo "✅ Deploy concluído!"
          echo "   Imagem: ${{ needs.build-and-push.outputs.image_uri }}"
          echo "   Cluster: ${{ vars.ECS_CLUSTER }}"
          echo "   Serviço: ${{ vars.ECS_SERVICE }}"
