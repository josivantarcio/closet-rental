# =============================================================================
# application-render.yml — Configurações para Render.com + Neon PostgreSQL
#
# Variáveis de ambiente necessárias no Render (Environment):
#   DATABASE_URL  → jdbc:postgresql://ep-***.sa-east-1.aws.neon.tech/aluguel?user=neondb_owner&password=***&sslmode=require
#   PORT          → injetado automaticamente pelo Render (10000)
#   JWT_SECRET    → chave HS256 (mínimo 64 hex chars)
#   CORS_ALLOWED_ORIGINS → https://seu-app.netlify.app
# =============================================================================

spring:
  datasource:
    url: ${DATABASE_URL}
    username:
    password:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 60000
      idle-timeout: 600000
      max-lifetime: 1800000
      initialization-fail-timeout: 60000

  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        # Desabilita validação do schema pelo Hibernate — Flyway já garante
        javax.persistence.schema-generation.database.action: none
    hibernate:
      ddl-auto: validate

  devtools:
    restart:
      enabled: false

  flyway:
    enabled: true
    validate-on-migrate: false   # já validamos localmente — evita round-trip extra ao Neon
    out-of-order: false

springdoc:
  swagger-ui:
    enabled: true   # mantém Swagger ativo para o cliente testar
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never

app:
  storage:
    provider: local   # sem S3 por enquanto

  notificacao:
    email:
      enabled: false  # sem SES por enquanto
