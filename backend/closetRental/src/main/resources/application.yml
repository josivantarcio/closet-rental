server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/aluguel
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    secret: 404D635166546A576E5A7234753778214125442A472D4B6150645367566B5970
    expiration: 86400
  locacao:
    caucao-padrao: 100.00
    percentual-multa-diaria: 0.10
  pagamento:
    gateway:
      taxa-falha: 0.10
