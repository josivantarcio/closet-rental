server:
  port: ${APP_PORT:8080}

spring:
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    test-connection: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aluguel}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: ${SHOW_SQL:true}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:404D635166546A576E5A7234753778214125442A472D4B6150645367566B5970}
    expiration: ${JWT_EXPIRATION:900}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}
  locacao:
    caucao-padrao: ${CAUCAO_PADRAO:100.00}
    percentual-multa-diaria: ${PERCENTUAL_MULTA_DIARIA:0.10}
  pagamento:
    gateway:
      taxa-falha: ${TAXA_FALHA_GATEWAY:0.10}
  notificacao:
    email:
      enabled: ${MAIL_ENABLED:false}
      remetente: ${MAIL_FROM:noreply@closetrental.com.br}
      nome-remetente: ${MAIL_FROM_NAME:Closet Rental}
    lembrete:
      cron: ${LEMBRETE_CRON:0 0 9 * * *}
